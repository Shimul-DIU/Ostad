<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration form</title>
</head>
<body>
  <h1>Student Registration form</h1>
  <form action="">
    <label for="name">Full name : </label>
    <input type="text" id="name" placeholder="Enter your Name" name="name" required><br><br>

    <label for="email">Email : </label>
    <input type="email" id="email" placeholder="Enter your Email" name="email" required><br><br>

    <label for="phone">Phone : </label>
    <input type="tel" id="phone" placeholder="Enter your Phone" name="phone" required><br><br>

    <label for="dob">Date of Birth : </label>
    <input type="date" id="dob" name="dob" required><br><br>

    <label for="gender">Gender : </label>
    <input type="radio" id="male" name="gender" value="male" required>
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female" required>
    <label for="female">Female</label>
    <input type="radio" id="other" name="gender" value="other" required>
    <label for="other">Other</label><br><br>

    <label for="department">Department : </label>
    <select id="department" name="department" required>
      <option value="">Select your Department</option>
      <option value="cse">CSE</option>
      <option value="eee">EEE</option>
      <option value="bba">BBA</option>
      <option value="english">English</option>
    </select><br><br>

    <label for="skills">Skills : </label>
    <input type="checkbox" name="html" id="html" value="html">
    <label for="html">HTML</label>
    <input type="checkbox" name="css" id="css" value="css">
    <label for="css">CSS</label>
    <input type="checkbox" name="javascript" id="javascript" value="javascript">
    <label for="javascript">JavaScript</label>
    <input type="checkbox" name="react" id="react" value="react">
    <label for="react">React</label><br><br>

    <label for="address">Address : </label><br><br>
    <textarea id="address" name="address" rows="4" cols="50" placeholder="Enter your Address" required></textarea><br><br>

    <label for="img">Profile Image : </label>
    <input type="file" id="img" name="img"  required><br><br>

    <label for="password">Password : </label>
    <input type="password" id="password" name="password" required><br><br>

    <label for="confirmPassword">Confirm Password : </label>
    <input type="password" id="confirmPassword" name="confirmPassword" required><br><br>

    <input type="submit" value="Register">
  </form>
</body>
</html>
